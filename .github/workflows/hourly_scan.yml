name: Hourly Multi-Chain Mining Scan

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Autonomous 1h IA Mining Discovery Agent
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python ai_mining_agent.py --max-evm 180

      - name: Commit updated accumulated registry, agent memory, and scan reports
        run: |
          git config user.name "omnirpc-ai-agent"
          git config user.email "actions@users.noreply.github.com"
          git add mining_registry.json mining_registry.csv agent_memory.json onchain_mining_scan_report.json onchain_mining_candidates.csv non_evm_onchain_scan.json pow_direct_scan.json blockscout_explorers_cache.json chainid_explorers_cache.json
          if git diff --staged --quiet; then
            echo "No new registry changes."
          else
            git commit -m "chore(agent): hourly cumulative mining registry update"
            git push
          fi
